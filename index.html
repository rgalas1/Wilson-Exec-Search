<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WilsonHCG | Executive Search & Talent Intelligence Hub</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>

    <style>

        :root {
            --brand-mint: #94E3C9;
            --brand-yellow: #FEF4D5;
            --brand-dark: #1A1A1A;
            --brand-teal: #00BA88;
            --white: #FFFFFF;
            --off-white: #F9FAFB;
            --font-heading: 'Archivo Black', 'Inter', sans-serif;
            --font-body: 'Merriweather', serif;
            
            /* Intel Dashboard Colors */
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1A1A1A;
            --text-muted: #64748B;
            --accent-primary: #00BA88; /* Teal */
            --accent-secondary: #94E3C9; /* Mint */
            --border-color: #E5E7EB;
            --success: #10B981;
            --font-intel: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background-color: var(--brand-mint);
            color: var(--brand-dark);
            line-height: 1.6;
        }

        /* --- Header & Navigation --- */
        header {
            background-color: var(--white);
            color: var(--brand-dark);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #E5E7EB;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-logo h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            letter-spacing: -2px;
            color: var(--brand-dark);
            text-transform: lowercase;
            margin-bottom: 2px;
        }

        .brand-logo span {
            font-family: var(--font-intel);
            font-size: 0.8rem;
            color: #666;
            font-weight: 400;
            text-transform: none;
        }

        nav { display: flex; gap: 1rem; }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--brand-dark);
            font-family: var(--font-intel);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            text-transform: none;
        }
        
        .nav-btn.active {
            font-weight: 700;
        }
        
        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--brand-teal);
        }

        .nav-btn:hover { color: var(--brand-teal); }

        /* --- Main Layout --- */
        .container { max-width: 1400px; margin: 2rem auto; padding: 0 1.5rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- PIPELINE KANBAN STYLES --- */
        .mandate-card { background: var(--brand-yellow); border-radius: 4px; margin-bottom: 1.5rem; overflow: hidden; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .mandate-header { padding: 1.25rem 1.75rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: var(--brand-dark); color: var(--white); user-select: none; }
        .mandate-header h2 { font-family: var(--font-heading); font-size: 1.1rem; text-transform: uppercase; }
        .mandate-toggle { font-family: var(--font-intel); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        .mandate-body { padding: 1.75rem; display: none; }
        .mandate-body.open { display: block; }
        .mandate-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
        .mandate-section h3 { font-family: var(--font-heading); font-size: 1rem; margin-bottom: 0.6rem; text-transform: uppercase; border-bottom: 2px solid var(--brand-dark); padding-bottom: 0.25rem; }
        .mandate-section ul { list-style: none; font-size: 0.95rem; font-family: var(--font-intel); }
        .mandate-section li { margin-bottom: 0.5rem; padding-left: 14px; position: relative; }
        .mandate-section li::before { content: "■"; position: absolute; left: 0; color: var(--brand-teal); font-size: 0.7rem; top: 4px; }
        
        .controls-panel { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; background: var(--white); padding: 1rem 1.25rem; border-radius: 4px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .search-box { flex: 1; min-width: 280px; }
        .search-box input { width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--border-color); border-radius: 4px; font-family: var(--font-intel); font-size: 0.9rem; outline: none; background: var(--off-white); }
        .filter-group { display: flex; gap: 0.75rem; }
        .filter-select { padding: 0.7rem 1rem; border: 1px solid var(--border-color); border-radius: 4px; font-family: var(--font-intel); font-weight: 600; font-size: 0.85rem; background: var(--off-white); outline: none; cursor: pointer; }

        .kanban-board { display: flex; gap: 1.5rem; overflow-x: auto; padding-bottom: 2rem; align-items: flex-start; }
        .kanban-column { background: rgba(255, 255, 255, 0.5); min-width: 330px; width: 330px; border-radius: 4px; padding: 1rem; border: none; }
        .kanban-header { font-family: var(--font-heading); font-size: 1rem; text-transform: uppercase; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--brand-dark); display: flex; justify-content: space-between; align-items: center; }
        .kanban-count { background: var(--brand-dark); color: var(--white); padding: 2px 10px; border-radius: 20px; font-size: 0.85rem; font-family: var(--font-intel); font-weight: bold; }
        
        .candidate-card { background: var(--white); border-radius: 4px; padding: 1.25rem; margin-bottom: 1rem; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.04); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .candidate-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .candidate-name { font-family: var(--font-heading); text-transform: uppercase; font-size: 1.25rem; margin-bottom: 0.25rem; color: var(--brand-dark); }
        .candidate-meta { font-size: 0.85rem; color: #666; margin-bottom: 0.75rem; font-family: var(--font-intel); }
        .badge { display: inline-block; padding: 4px 8px; background: var(--brand-yellow); border: none; font-family: var(--font-intel); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.75rem; border-radius: 2px; }
        .card-preview { font-size: 0.95rem; margin-bottom: 1.25rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; color: #333; }
        .card-actions { display: flex; gap: 0.75rem; }
        .btn-action { flex: 1; padding: 0.7rem; border: none; font-family: var(--font-heading); font-size: 0.75rem; cursor: pointer; border-radius: 2px; text-align: center; text-decoration: none; text-transform: uppercase; transition: background 0.2s; }
        .btn-view { background: var(--brand-dark); color: var(--white); }
        .btn-view:hover { background: #333; }
        .btn-linkedin { background: var(--brand-teal); color: var(--white); }
        .btn-linkedin:hover { background: #009970; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 1.5rem; }
        .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
        .modal-card { background: var(--white); border: none; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2.5rem; position: relative; border-radius: 4px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); }
        .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; background: var(--brand-dark); color: var(--white); border: none; width: 40px; height: 40px; border-radius: 50%; font-family: var(--font-heading); font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .modal-close:hover { background: #333; }
        .modal-section { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); }
        .modal-section h4 { font-family: var(--font-heading); text-transform: uppercase; margin-bottom: 0.75rem; font-size: 0.95rem; }

        /* --- INTEL DASHBOARD STYLES --- */
        .intel-tab-wrapper { font-family: var(--font-intel); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
        .card { background: var(--card-bg); border: none; border-radius: 4px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card-header { margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); }
        .card-header h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin: 0; font-family: var(--font-heading); text-transform: uppercase; }
        .kpi-card { grid-column: span 3; display: flex; flex-direction: column; justify-content: center; }
        .kpi-value { font-size: 2.5rem; font-weight: 700; color: var(--brand-teal); line-height: 1.2; }
        .kpi-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .chart-card-large { grid-column: span 8; }
        .chart-card-small { grid-column: span 4; }
        
        .vp-header-box { background: var(--brand-dark); color: white; padding: 2rem; border-radius: 4px; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .vp-header-text h2 { font-family: var(--font-heading); text-transform: uppercase; font-size: 1.8rem; margin-bottom: 0.5rem; font-weight: normal; }
        .vp-header-text p { color: #94A3B8; max-width: 600px; margin: 0; font-family: var(--font-intel); }
        
        .comp-card { background: white; border-left: 4px solid var(--brand-teal); padding: 1.5rem; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); margin-bottom: 1rem; border-top: none; border-right: none; border-bottom: none; }
        .comp-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.25rem; font-family: var(--font-heading); text-transform: uppercase; }
        .comp-company { color: var(--brand-teal); font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .comp-details { display: flex; gap: 1.5rem; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
        .comp-salary { font-size: 1.25rem; font-weight: 700; color: var(--success); }
        
        .live-btn { display: inline-block; background: var(--bg-color); border: 1px solid var(--border-color); padding: 0.4rem 0.8rem; border-radius: 2px; font-size: 0.75rem; font-weight: 600; color: var(--text-main); text-decoration: none; transition: background 0.2s; }
        .live-btn:hover { background: #E2E8F0; }

        .filters-area { display: flex; gap: 1rem; margin-bottom: 1.5rem; background: white; padding: 1rem; border-radius: 4px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .intel-filter-group { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; }
        .intel-filter-group label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .intel-filter-group select { padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 2px; font-family: var(--font-intel); }
        
        .table-card { grid-column: span 12; }
        table.dataTable { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
        table.dataTable thead th { background: #F1F5F9; border-bottom: 1px solid var(--border-color); padding: 1rem; text-align: left; font-weight: 600; color: var(--text-main); font-family: var(--font-heading); text-transform: uppercase; }
        table.dataTable tbody td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); }
        
        .intel-badge { padding: 4px 8px; border-radius: 2px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge-vp { background: var(--brand-yellow); color: var(--brand-dark); }
        .badge-dir { background: var(--off-white); color: var(--brand-dark); }
        .badge-mgr { background: var(--off-white); color: var(--brand-dark); }
        .badge-ic { background: var(--off-white); color: var(--brand-dark); }

        /* Qualitative Styles Restored */
        .qualitative-insights { margin-bottom: 2rem; background: var(--white); border: none; border-radius: 4px; padding: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .qualitative-insights h3 { font-family: var(--font-heading); text-transform: uppercase; margin-bottom: 1rem; border-bottom: 2px solid var(--brand-dark); padding-bottom: 0.5rem; }
        .signal-list { list-style: none; margin-bottom: 2rem; font-family: var(--font-intel); font-size: 0.95rem; }
        .signal-list li { margin-bottom: 0.75rem; padding-left: 1.5rem; position: relative; }
        .signal-list li::before { content: "►"; position: absolute; left: 0; color: var(--brand-teal); font-size: 0.8rem; }
        
        .battle-cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 1rem; }
        .battle-card { background: var(--off-white); border: none; padding: 1.5rem; border-radius: 4px; }
        .battle-card h4 { font-family: var(--font-heading); text-transform: uppercase; margin-bottom: 1rem; color: var(--brand-dark); border-bottom: 3px solid var(--brand-teal); display: inline-block; padding-bottom: 0.25rem; }
        .battle-card p { font-family: var(--font-intel); font-size: 0.95rem; margin-bottom: 0.5rem; }
        .battle-card .talk-track { background: var(--brand-yellow); border: none; padding: 1.25rem; margin-top: 1rem; font-style: italic; font-size: 0.95rem; font-family: var(--font-body); }
        
        .exec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; margin-top: 1rem; }
        .exec-card { background: var(--off-white); border: none; padding: 1.5rem; border-radius: 4px; }
        .exec-card h4 { font-family: var(--font-heading); font-size: 1rem; margin-bottom: 0.75rem; text-transform: uppercase; color: var(--brand-dark); }

        /* Region Toggle */
        .region-toggle-container { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; background: var(--white); padding: 1rem; border-radius: 4px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .region-btn { padding: 0.6rem 1.5rem; background: var(--off-white); border: 1px solid var(--border-color); border-radius: 2px; font-family: var(--font-intel); font-weight: 600; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
        .region-btn:hover { background: #E2E8F0; }
        .region-btn.active { background: var(--brand-teal); color: white; border-color: var(--brand-teal); }

    </style>
